[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iaifi-gm"
version = "0.1.0"
description = "Helper package for the IAIFI Summer School 2026 generative-models tutorial."
requires-python = ">=3.11"
dependencies = [
    "jax>=0.5",
    "flax>=0.12.6",  # 0.12.1 breaks @nnx.jit with jax 0.9.x; 0.12.6+ verified
    "optax>=0.2.4",
    "diffrax>=0.6.2",
    "bijx>=1.3.2",
    "jax-autovmap>=0.3.0",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]
